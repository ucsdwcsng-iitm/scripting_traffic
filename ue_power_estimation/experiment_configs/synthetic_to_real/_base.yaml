# Paper Sec. 5.2 / Table 4: synthetic-to-real generalization. One XGBoost model
# is trained on the pooled 18 synthetic captures (single global affine TR 38.840
# calibration) and evaluated frozen on the final 10 s of each real 60 s capture.
# data.train/validation are required window stubs; with train_pool present they
# only set the window metadata. Per-app files set experiment.id + data.test.
schema_version: 1
data:
  device: qualcomm
  train:      {capture_id: synthetic/synthb_youtube_s3_dl8000_ul1500, start_s: 0,  end_s: 40}
  validation: {capture_id: synthetic/synthb_youtube_s3_dl8000_ul1500, start_s: 40, end_s: 50}
  train_pool:
    - synthetic/synthb_youtube_s3_dl8000_ul1500
    - synthetic/synthb_youtube_s4_dl4000_ul1000
    - synthetic/synthb_youtube_s5_dl16000_ul1500
    - synthetic/synthb_youtube_s6_dl25000_ul2000
    - synthetic/synthb_youtube_s7_dl12000_ul1500
    - synthetic/synthb_youtube_s8_dl6000_ul1200
    - synthetic/synthb_social_scroll_s2_dl8000_ul2000
    - synthetic/synthb_social_scroll_s3_dl16000_ul3000
    - synthetic/synthb_social_scroll_s4_dl12000_ul2000
    - synthetic/synthb_web_browse_s2_dl8000_ul3000
    - synthetic/synthb_web_browse_s3_dl16000_ul4000
    - synthetic/synthb_web_browse_s4_dl25000_ul4000
    - synthetic/synthb_video_call_s2_dl4000_ul4000
    - synthetic/synthb_video_call_s3_dl2000_ul2000
    - synthetic/synthb_video_call_s4_dl6000_ul6000
    - synthetic/synthb_sweep_s2_dl40000_ul10000
    - synthetic/synthb_sweep_s3_dl25000_ul8000
    - synthetic/synthb_sweep_s4_dl16000_ul4000
pipelines:
  srsran: true
  3gpp: true
preprocessing:
  feature_profile: default_causal
  offset_search_ms: 250
  offset_step_ms: 1
  # TR 38.840 micro-sleep power (mW) that the measured power floor maps to.
  microsleep_power_mw: 400
model:
  name: xgboost
  source: srsran
  params:
    objective: reg:squarederror
    n_estimators: 1500
    learning_rate: 0.03
    max_depth: 7
    min_child_weight: 2
    subsample: 0.9
    colsample_bytree: 0.8
    reg_lambda: 2.0
    tree_method: hist
    random_state: 42
    early_stopping_rounds: 100
  other:
    # false: predict absolute power from gNB features only (no 3GPP input).
    # true: predict the residual over the affine-calibrated TR 38.840 estimate,
    #       with the raw and calibrated TR 38.840 traces as extra inputs (Eq. 3).
    residual_learning: true
validation:
  require_link_match: false
evaluation:
  metrics: [mae_mw, rmse_mw, mape_pct, energy_error_pct]
  plots: [holdout, residuals, model_comparison]
retention:
  predictions: true
  feature_matrices: processed_data
